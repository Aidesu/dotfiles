# --- General ---
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Colors ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"  # true color in Kitty

# --- Responsiveness ---
set -sg escape-time 10
set -g focus-events on

# --- Activity ---
setw -g monitor-activity on
set -g visual-activity off

# --- Key bindings ---
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Alt + arrows: switch panes without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'dracula/tmux'

set -g @continuum-restore 'on'

# --- Dracula ---
set -g @dracula-plugins "git cpu-usage ram-usage time"
set -g @dracula-show-powerline true  # needs a Nerd Font
set -g @dracula-show-left-icon session
set -g @dracula-show-flags true
set -g @dracula-military-time true
set -g @dracula-show-fahrenheit false
set -g @dracula-refresh-rate 5

# Pink pastel palette (overrides Dracula's default colors)
set -g @dracula-colors "
white='#fde7f3'
gray='#4a3550'
dark_gray='#2a1f2d'
light_purple='#d8a7f5'
dark_purple='#9b6bb0'
cyan='#ffb3d9'
green='#f49ac1'
orange='#ffc4a3'
red='#ff6b9a'
pink='#ff8fc7'
yellow='#fff0a8'
"

# Widget colors: "background foreground"
set -g @dracula-git-colors "pink dark_gray"
set -g @dracula-cpu-usage-colors "light_purple dark_gray"
set -g @dracula-ram-usage-colors "cyan dark_gray"
set -g @dracula-time-colors "dark_purple white"

# Must stay at the very bottom: loads all plugins
run '~/.tmux/plugins/tpm/tpm'
